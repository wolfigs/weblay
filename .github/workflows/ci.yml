name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: connector
        run: npm install --no-fund --no-audit
      - name: Typecheck
        working-directory: connector
        run: npm run typecheck
      - name: Unit tests
        working-directory: connector
        run: npm test
      - name: Build
        working-directory: connector
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: connector
          path: web/connector/weblay.js

  server:
    runs-on: ubuntu-latest
    needs: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: connector
          path: web/connector
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build (all binaries)
        run: CGO_ENABLED=0 go build ./...

  docker:
    runs-on: ubuntu-latest
    needs: server
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wolfigs/weblay:ci .
